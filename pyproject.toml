[project]
name = "artisearch"
version = "0.1.0"
description = "ARTi supply-chain & partnership research service for NVIDIA (NVDA)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artisearch"]

[project.scripts]
artisearch = "artisearch.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
